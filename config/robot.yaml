robot:
  url: ws://192.168.0.10:8080   # Adresse des Roboter-Servers
  connect_timeout: 5.0          # s, pro Verbindungsversuch
  read_timeout: 10.0            # s, Standard-Timeout für read()
  connect_retries: 3            # Versuche beim Verbinden
  retry_delay: 2.0              # s zwischen den Versuchen
  ping_interval: 20.0           # s, Keepalive-Ping; null = aus (falls der Server keine Pings kann)
  ping_timeout: 20.0            # s, ohne Pong → Verbindung gilt als tot